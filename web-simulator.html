<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Hyu Heroes — Web Simulator</title>
  <style>
    :root {
      --bg: #07100d;
      --panel: rgba(12, 25, 21, .92);
      --panel-2: rgba(18, 34, 29, .96);
      --line: rgba(228, 255, 237, .13);
      --line-strong: rgba(228, 255, 237, .28);
      --text: #eef8f1;
      --muted: #91a89a;
      --primary: #4ade80;
      --secondary: #0d9488;
      --danger: #ff8d80;
      --mana: #83def7;
      --radius: 20px;
      --shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "DM Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 16% 10%, rgba(74, 222, 128, .14), transparent 28rem),
        radial-gradient(circle at 84% 16%, rgba(13, 148, 136, .15), transparent 32rem),
        var(--bg);
    }

    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

    .app {
      width: min(1680px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 280px;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .topbar,
    .panel,
    .stage {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .topbar {
      grid-column: 1 / -1;
      min-height: 58px;
      padding: 10px 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #062015;
      font-weight: 950;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
    }
    .brand-title { font-weight: 900; letter-spacing: -.02em; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .pill,
    .button {
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.04);
    }
    .pill { padding: 7px 10px; font-size: 11px; color: #c5d6ca; }
    .button {
      min-height: 40px;
      padding: 0 13px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 180ms ease, opacity 180ms ease;
    }
    .button:hover { transform: translateY(-2px); }
    .button:active { transform: translateY(0) scale(.98); }
    .button.primary { color: #042015; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--secondary)); }
    .button:disabled { cursor: not-allowed; opacity: .45; transform: none; }

    .panel { padding: 14px; border-radius: var(--radius); min-height: 0; }
    .panel-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .panel-heading h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; }
    .panel-heading span { color: var(--muted); font-size: 10px; }

    .phase-list { display: grid; gap: 8px; }
    .phase {
      min-height: 46px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 13px;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: center;
      transition: transform 220ms ease, opacity 220ms ease;
    }
    .phase-index {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 900;
    }
    .phase strong { display: block; color: inherit; font-size: 11px; }
    .phase small { display: block; margin-top: 2px; font-size: 9px; opacity: .78; }
    .phase.active { color: var(--text); transform: translateX(3px); border-color: rgba(74,222,128,.34); background: rgba(74,222,128,.08); }
    .phase.active .phase-index { color: #072015; border-color: transparent; background: var(--primary); }

    .event-log { display: grid; gap: 8px; max-height: calc(100vh - 170px); overflow: auto; }
    .event {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.025);
    }
    .event strong { display: block; font-size: 10px; }
    .event span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.45; word-break: break-word; }

    .stage {
      min-width: 0;
      min-height: calc(100vh - 104px);
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto minmax(430px, 1fr) auto auto;
      position: relative;
    }

    .hero-strip {
      min-height: 70px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }
    .hero-strip.player { border-top: 1px solid var(--line); border-bottom: 0; }
    .hero { min-width: 0; }
    .hero strong { display: block; font-size: 13px; }
    .hero span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
    .hero-stats { display: flex; gap: 8px; }
    .orb {
      min-width: 54px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      background: rgba(0,0,0,.16);
    }
    .orb.health { color: #ffb4aa; }
    .orb.resource { color: #b7efff; }

    .opponent-hand {
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-back {
      width: 34px;
      height: 46px;
      margin: 0 -8px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 7px;
      background: linear-gradient(145deg, #214338, #0d1b17);
      transform-origin: 50% 130%;
    }
    .card-back:nth-child(1) { transform: rotate(-9deg) translateY(4px); }
    .card-back:nth-child(2) { transform: rotate(-4deg) translateY(1px); }
    .card-back:nth-child(4) { transform: rotate(4deg) translateY(1px); }
    .card-back:nth-child(5) { transform: rotate(9deg) translateY(4px); }

    .battlefield {
      min-height: 430px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(5, minmax(90px, 1fr));
      gap: 8px;
    }
    .lane {
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      display: grid;
      grid-template-rows: 1fr 30px 1fr;
      background: linear-gradient(180deg, rgba(134,64,78,.08), transparent 42%, transparent 58%, rgba(74,222,128,.06));
      transition: transform 200ms ease, opacity 200ms ease;
    }
    .lane.targetable { cursor: pointer; box-shadow: inset 0 0 0 1px rgba(74,222,128,.34); }
    .lane.targetable:hover { transform: translateY(-3px); }
    .slot { min-height: 0; display: grid; place-items: center; }
    .lane-label { display: grid; place-items: center; color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .08em; }

    .physical-card {
      appearance: none;
      border: 1px solid rgba(240,255,245,.26);
      color: var(--text);
      background:
        linear-gradient(145deg, rgba(255,255,255,.045), transparent 45%),
        linear-gradient(150deg, #18372c, #0c1c17 68%);
      box-shadow: 0 14px 30px rgba(0,0,0,.28), inset 0 0 0 5px rgba(255,255,255,.025);
      cursor: pointer;
      overflow: hidden;
      position: relative;
      display: grid;
      place-items: center;
      text-align: center;
      transition: transform 220ms cubic-bezier(.2,.8,.2,1), opacity 180ms ease;
    }
    .physical-card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: inherit;
      pointer-events: none;
    }
    .physical-card:hover { transform: translateY(-8px); }
    .physical-card .card-name {
      width: 82%;
      font-size: clamp(10px, 1.1vw, 13px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -.01em;
      position: relative;
      z-index: 1;
    }

    .board-card {
      width: min(100%, 112px);
      aspect-ratio: .72;
      border-radius: 13px;
    }
    .board-card.enemy { background: linear-gradient(150deg, #4a2730, #1b1014 68%); }

    .hand-wrap {
      min-height: 154px;
      padding: 8px 14px 12px;
      display: flex;
      align-items: end;
      justify-content: center;
      overflow: visible;
    }
    .hand {
      width: min(760px, 100%);
      min-height: 136px;
      display: flex;
      justify-content: center;
      align-items: end;
      gap: clamp(4px, .9vw, 11px);
    }
    .hand-card {
      width: clamp(88px, 12.5vw, 126px);
      flex: 0 1 126px;
      aspect-ratio: .68;
      border-radius: 12px;
      animation: deal-in 420ms cubic-bezier(.2,.8,.2,1) both;
    }
    .hand-card.selected { box-shadow: 0 0 0 2px var(--primary), 0 20px 38px rgba(0,0,0,.38); transform: translateY(-16px); }
    .hand-card.unaffordable { opacity: .48; }
    @keyframes deal-in { from { opacity: 0; transform: translateY(45px) scale(.9); } }

    .controls {
      min-height: 58px;
      padding: 8px 14px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .detail-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 18px;
      display: grid;
      place-items: center;
      background: rgba(2, 8, 6, .76);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .detail-backdrop.open { opacity: 1; pointer-events: auto; }
    .detail-dialog {
      width: min(720px, 100%);
      max-height: min(820px, calc(100vh - 36px));
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      background: #0d1d18;
      box-shadow: 0 36px 100px rgba(0,0,0,.62);
      transform: translateY(16px) scale(.98);
      transition: transform 220ms cubic-bezier(.2,.8,.2,1), opacity 180ms ease;
    }
    .detail-backdrop.open .detail-dialog { transform: translateY(0) scale(1); }
    .detail-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .detail-head h2 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .detail-id { margin-top: 4px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.04);
      cursor: pointer;
    }
    .detail-body { padding: 18px; display: grid; gap: 16px; }
    .detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .detail-stat { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.025); }
    .detail-stat span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
    .detail-stat strong { display: block; margin-top: 5px; font-size: 20px; }
    .detail-section { padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.02); }
    .detail-section h3 { margin: 0 0 9px; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 14px; font-size: 12px; }
    .detail-grid span { color: var(--muted); }
    .ability { padding: 12px; border-radius: 13px; background: rgba(74,222,128,.045); }
    .ability + .ability { margin-top: 8px; }
    .ability strong { font-size: 12px; }
    .ability dl { margin: 8px 0 0; display: grid; grid-template-columns: 86px 1fr; gap: 5px 8px; font-size: 10px; line-height: 1.4; }
    .ability dt { color: var(--muted); }
    .ability dd { margin: 0; }
    .detail-actions { padding: 0 18px 18px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 130;
      max-width: min(520px, calc(100vw - 28px));
      padding: 10px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      color: var(--text);
      background: #13271f;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition: transform 180ms ease, opacity 180ms ease;
      font-size: 11px;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 210px minmax(0,1fr); }
      .events-panel { display: none; }
    }

    @media (max-width: 760px) {
      .app { padding: 8px; display: block; }
      .topbar { margin-bottom: 8px; }
      .phase-panel { display: none; }
      .stage { min-height: calc(100vh - 84px); border-radius: 18px; }
      .battlefield { min-height: 380px; padding: 7px; grid-template-columns: repeat(5, minmax(58px,1fr)); gap: 4px; }
      .lane { padding: 4px; border-radius: 11px; }
      .board-card { border-radius: 9px; }
      .hand-wrap { min-height: 126px; padding-inline: 4px; }
      .hand { min-height: 112px; gap: 1px; }
      .hand-card { min-width: 58px; width: 19vw; border-radius: 9px; }
      .physical-card:hover { transform: translateY(-5px); }
      .physical-card .card-name { font-size: 9px; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-head h2 { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <div>
          <div class="brand-title">Hyu Heroes Simulator</div>
          <div class="brand-sub">Deterministic presentation fixture</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="pill" id="turnLabel">Turn 3</span>
        <span class="pill" id="seedLabel">Seed 27601</span>
        <button class="button" id="restartButton" type="button">Reset fixture</button>
      </div>
    </header>

    <aside class="panel phase-panel">
      <div class="panel-heading"><h2>Phases</h2><span id="phaseName">Main Action</span></div>
      <div class="phase-list" id="phaseList"></div>
    </aside>

    <section class="stage" aria-label="Battlefield simulator">
      <div class="hero-strip">
        <div class="hero"><strong>Obsidian Regent</strong><span>Opponent · Control</span></div>
        <div class="hero-stats">
          <div class="orb health">♥ <span id="enemyHealth">20</span></div>
          <div class="orb resource">◆ <span id="enemyResource">4</span></div>
        </div>
      </div>

      <div class="opponent-hand" aria-label="Opponent hand">
        <div class="card-back"></div><div class="card-back"></div><div class="card-back"></div><div class="card-back"></div><div class="card-back"></div>
      </div>

      <div class="battlefield" id="battlefield"></div>

      <div class="hero-strip player">
        <div class="hero"><strong>Verdant Marshal</strong><span>Player · Midrange</span></div>
        <div class="hero-stats">
          <div class="orb health">♥ <span id="playerHealth">20</span></div>
          <div class="orb resource">◆ <span id="playerResource">5</span></div>
        </div>
      </div>

      <div>
        <div class="hand-wrap"><div class="hand" id="hand" aria-label="Player hand"></div></div>
        <div class="controls"><button class="button primary" id="phaseButton" type="button">End Main Action</button></div>
      </div>
    </section>

    <aside class="panel events-panel">
      <div class="panel-heading"><h2>Event stream</h2><span>Presentation</span></div>
      <div class="event-log" id="eventLog"></div>
    </aside>
  </main>

  <div class="detail-backdrop" id="detailBackdrop" aria-hidden="true">
    <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <header class="detail-head">
        <div><h2 id="detailTitle">Card</h2><div class="detail-id" id="detailId"></div></div>
        <button class="icon-button" id="detailClose" type="button" aria-label="Close card details">×</button>
      </header>
      <div class="detail-body" id="detailBody"></div>
      <footer class="detail-actions">
        <button class="button" id="detailCloseSecondary" type="button">Close</button>
        <button class="button primary" id="detailPlay" type="button">Select to play</button>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /**
     * WEB_SIMULATOR_PRESENTATION
     * Purpose: Renders a deterministic lane-battle fixture with physical card shells and a detail-first interaction model.
     * Connections: Mirrors command/event boundaries intended for the authoritative C# runtime without reimplementing gameplay primitives.
     * Risk: Medium because this file is presentation-only but must not become an alternative source of authoritative game rules.
     */
    (() => {
      "use strict";

      const PHASES = [
        { id: "start", label: "Start Turn", note: "Start triggers" },
        { id: "resource", label: "Resource + Draw", note: "Refresh / draw" },
        { id: "main", label: "Main Action", note: "Play / activate" },
        { id: "response", label: "Response", note: "Reaction window" },
        { id: "combat", label: "Combat", note: "Lane resolution" },
        { id: "end", label: "End Turn", note: "Cleanup" }
      ];

      const CARD_DEFINITIONS = Object.freeze({
        "card.bloom_lancer": {
          name: "Bloom Lancer", type: "Unit", className: "Striker", alignment: "Neutral", tags: ["Plant", "Soldier"], keywords: ["Tempo"],
          cost: 2, attack: 3, health: 2, text: "Fast pressure unit built to contest an open lane.",
          abilities: [{ name: "Forward Bloom", trigger: "On Play", target: "Current lane", condition: "Lane is empty", effects: "Summon self; establish lane pressure." }]
        },
        "card.root_sage": {
          name: "Root Sage", type: "Unit", className: "Tank", alignment: "Neutral", tags: ["Plant", "Mystic"], keywords: ["Guard"],
          cost: 3, attack: 2, health: 5, text: "Durable lane anchor intended to stabilize contested space.",
          abilities: [{ name: "Deep Root", trigger: "On Summoned", target: "Self", condition: "Always", effects: "Defensive placeholder; execution handler not implemented in HTML." }]
        },
        "card.sunforge_beetle": {
          name: "Sunforge Beetle", type: "Unit", className: "Striker", alignment: "Neutral", tags: ["Beast", "Machine"], keywords: [],
          cost: 4, attack: 5, health: 4, text: "Heavy mid-game body with efficient board pressure.",
          abilities: [{ name: "Solar Shell", trigger: "On Damaged", target: "Self", condition: "Source is damaged", effects: "Runtime-ready metadata example." }]
        },
        "card.grove_scout": {
          name: "Grove Scout", type: "Unit", className: "Support", alignment: "Neutral", tags: ["Plant", "Scout"], keywords: [],
          cost: 1, attack: 1, health: 2, text: "Cheap tempo unit for early lane development.",
          abilities: [{ name: "Pathfinder", trigger: "On Play", target: "Adjacent lanes", condition: "Always", effects: "Targeting metadata example." }]
        },
        "card.ancient_canopy": {
          name: "Ancient Canopy", type: "Unit", className: "Tank", alignment: "Neutral", tags: ["Plant", "Ancient"], keywords: ["Guard"],
          cost: 6, attack: 6, health: 7, text: "Large late-game body; intentionally unaffordable in this fixture.",
          abilities: [{ name: "Canopy Dominion", trigger: "On Summoned", target: "Friendly board", condition: "Turn >= 3", effects: "Structured effect metadata placeholder." }]
        },
        "card.moss_sentinel": {
          name: "Moss Sentinel", type: "Unit", className: "Tank", alignment: "Neutral", tags: ["Plant"], keywords: ["Guard"], cost: 2, attack: 2, health: 5,
          text: "Existing friendly board unit.", abilities: [{ name: "Hold Ground", trigger: "Passive", target: "Self", condition: "On board", effects: "Board fixture metadata." }]
        },
        "card.briar_guard": {
          name: "Briar Guard", type: "Unit", className: "Tank", alignment: "Neutral", tags: ["Plant"], keywords: ["Guard"], cost: 3, attack: 3, health: 4,
          text: "Existing friendly board unit.", abilities: [{ name: "Briar Wall", trigger: "Passive", target: "Current lane", condition: "On board", effects: "Board fixture metadata." }]
        },
        "card.volt_jackal": {
          name: "Volt Jackal", type: "Unit", className: "Striker", alignment: "Enemy", tags: ["Beast", "Electric"], keywords: [], cost: 4, attack: 4, health: 2,
          text: "Existing enemy board unit.", abilities: [{ name: "Voltage Bite", trigger: "On Attack", target: "Enemy in lane", condition: "Target exists", effects: "Board fixture metadata." }]
        },
        "card.gloom_wisp": {
          name: "Gloom Wisp", type: "Unit", className: "Control", alignment: "Enemy", tags: ["Spirit"], keywords: [], cost: 2, attack: 1, health: 4,
          text: "Existing enemy board unit.", abilities: [{ name: "Gloom Veil", trigger: "After Combat", target: "Current lane", condition: "Source survives", effects: "Board fixture metadata." }]
        }
      });

      const INITIAL_SNAPSHOT = Object.freeze({
        schemaVersion: 1,
        seed: 27601,
        turn: 3,
        phase: "main",
        player: { health: 20, resource: 5 },
        enemy: { health: 20, resource: 4 },
        lanes: [
          { id: "lane-0", enemy: null, player: null },
          { id: "lane-1", enemy: null, player: { instanceId: "p-09", definitionId: "card.moss_sentinel", attack: 2, health: 5 } },
          { id: "lane-2", enemy: { instanceId: "e-21", definitionId: "card.volt_jackal", attack: 4, health: 2 }, player: null },
          { id: "lane-3", enemy: null, player: null },
          { id: "lane-4", enemy: { instanceId: "e-24", definitionId: "card.gloom_wisp", attack: 1, health: 4 }, player: { instanceId: "p-11", definitionId: "card.briar_guard", attack: 3, health: 4 } }
        ],
        hand: [
          { instanceId: "h-31", definitionId: "card.bloom_lancer" },
          { instanceId: "h-32", definitionId: "card.root_sage" },
          { instanceId: "h-33", definitionId: "card.sunforge_beetle" },
          { instanceId: "h-34", definitionId: "card.grove_scout" },
          { instanceId: "h-35", definitionId: "card.ancient_canopy" }
        ]
      });

      const deepClone = value => JSON.parse(JSON.stringify(value));
      const escapeHtml = input => String(input).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const definitionFor = card => CARD_DEFINITIONS[card.definitionId] || { name: card.definitionId, type: "Unknown", className: "Unknown", alignment: "Unknown", tags: [], keywords: [], cost: 0, attack: card.attack ?? 0, health: card.health ?? 0, text: "No metadata.", abilities: [] };

      class DemoSimulationAdapter {
        constructor(initialSnapshot) {
          this.initial = deepClone(initialSnapshot);
          this.snapshot = deepClone(initialSnapshot);
          this.commandSequence = 0;
        }

        restart() {
          this.snapshot = deepClone(this.initial);
          this.commandSequence = 0;
          return this.result("SnapshotLoaded", { reason: "restart" });
        }

        submit(command) {
          this.commandSequence += 1;
          if (command.type === "PlayCardCommand") return this.playCard(command);
          if (command.type === "EndPhaseCommand") return this.endPhase(command);
          return { accepted: false, command: { ...command, sequence: this.commandSequence }, snapshot: deepClone(this.snapshot), events: [{ type: "CommandRejected", reason: "Unknown demo command" }] };
        }

        playCard(command) {
          const cardIndex = this.snapshot.hand.findIndex(card => card.instanceId === command.cardInstanceId);
          const lane = this.snapshot.lanes.find(item => item.id === command.laneId);
          if (cardIndex < 0 || !lane || lane.player) return this.reject(command, "Card or lane is no longer legal in the fixture.");
          const card = this.snapshot.hand[cardIndex];
          const definition = definitionFor(card);
          if (this.snapshot.phase !== "main") return this.reject(command, "Cards can only be played during the demo main phase.");
          if (definition.cost > this.snapshot.player.resource) return this.reject(command, "Insufficient resource.");

          this.snapshot.player.resource -= definition.cost;
          this.snapshot.hand.splice(cardIndex, 1);
          lane.player = { instanceId: card.instanceId, definitionId: card.definitionId, attack: definition.attack, health: definition.health };
          return {
            accepted: true,
            command: { ...command, sequence: this.commandSequence },
            snapshot: deepClone(this.snapshot),
            events: [
              { type: "ResourceSpent", amount: definition.cost },
              { type: "CardPlayed", cardInstanceId: card.instanceId, definitionId: card.definitionId, laneId: lane.id }
            ]
          };
        }

        endPhase(command) {
          const index = PHASES.findIndex(phase => phase.id === this.snapshot.phase);
          const nextIndex = (index + 1) % PHASES.length;
          this.snapshot.phase = PHASES[nextIndex].id;
          if (nextIndex === 0) {
            this.snapshot.turn += 1;
            this.snapshot.player.resource = Math.min(10, this.snapshot.player.resource + 1);
            this.snapshot.enemy.resource = Math.min(10, this.snapshot.enemy.resource + 1);
          }
          return { accepted: true, command: { ...command, sequence: this.commandSequence }, snapshot: deepClone(this.snapshot), events: [{ type: "PhaseChanged", phase: this.snapshot.phase }] };
        }

        reject(command, reason) {
          return { accepted: false, command: { ...command, sequence: this.commandSequence }, snapshot: deepClone(this.snapshot), events: [{ type: "CommandRejected", reason }] };
        }

        result(type, payload) {
          return { accepted: true, command: null, snapshot: deepClone(this.snapshot), events: [{ type, ...payload }] };
        }
      }

      const simulation = new DemoSimulationAdapter(INITIAL_SNAPSHOT);
      let snapshot = deepClone(INITIAL_SNAPSHOT);
      let selectedCardId = null;
      let detailReference = null;
      let toastTimer = null;

      const el = {
        battlefield: document.getElementById("battlefield"), hand: document.getElementById("hand"), phaseList: document.getElementById("phaseList"),
        phaseName: document.getElementById("phaseName"), phaseButton: document.getElementById("phaseButton"), restartButton: document.getElementById("restartButton"),
        eventLog: document.getElementById("eventLog"), turnLabel: document.getElementById("turnLabel"), seedLabel: document.getElementById("seedLabel"),
        playerHealth: document.getElementById("playerHealth"), playerResource: document.getElementById("playerResource"), enemyHealth: document.getElementById("enemyHealth"),
        enemyResource: document.getElementById("enemyResource"), detailBackdrop: document.getElementById("detailBackdrop"), detailTitle: document.getElementById("detailTitle"),
        detailId: document.getElementById("detailId"), detailBody: document.getElementById("detailBody"), detailPlay: document.getElementById("detailPlay"),
        detailClose: document.getElementById("detailClose"), detailCloseSecondary: document.getElementById("detailCloseSecondary"), toast: document.getElementById("toast")
      };

      function renderAll() {
        renderStats();
        renderPhases();
        renderBattlefield();
        renderHand();
      }

      function renderStats() {
        el.turnLabel.textContent = `Turn ${snapshot.turn}`;
        el.seedLabel.textContent = `Seed ${snapshot.seed}`;
        el.playerHealth.textContent = snapshot.player.health;
        el.playerResource.textContent = snapshot.player.resource;
        el.enemyHealth.textContent = snapshot.enemy.health;
        el.enemyResource.textContent = snapshot.enemy.resource;
      }

      function renderPhases() {
        const current = PHASES.findIndex(phase => phase.id === snapshot.phase);
        el.phaseName.textContent = PHASES[current]?.label || snapshot.phase;
        el.phaseList.innerHTML = PHASES.map((phase, index) => `<div class="phase ${index === current ? "active" : ""}"><div class="phase-index">${index + 1}</div><div><strong>${escapeHtml(phase.label)}</strong><small>${escapeHtml(phase.note)}</small></div></div>`).join("");
        const next = PHASES[(current + 1) % PHASES.length];
        el.phaseButton.textContent = `Advance to ${next.label}`;
      }

      function renderBattlefield() {
        el.battlefield.innerHTML = snapshot.lanes.map((lane, index) => {
          const targetable = Boolean(selectedCardId && !lane.player && snapshot.phase === "main");
          return `<section class="lane ${targetable ? "targetable" : ""}" data-lane-id="${escapeHtml(lane.id)}" aria-label="Lane ${index + 1}">
            <div class="slot">${renderBoardCard(lane.enemy, true)}</div>
            <div class="lane-label">Lane ${index + 1}</div>
            <div class="slot">${renderBoardCard(lane.player, false)}</div>
          </section>`;
        }).join("");
      }

      function renderBoardCard(card, enemy) {
        if (!card) return "";
        const definition = definitionFor(card);
        return `<button class="physical-card board-card ${enemy ? "enemy" : ""}" type="button" data-board-card-id="${escapeHtml(card.instanceId)}" data-definition-id="${escapeHtml(card.definitionId)}" aria-label="View ${escapeHtml(definition.name)} details"><span class="card-name">${escapeHtml(definition.name)}</span></button>`;
      }

      function renderHand() {
        el.hand.innerHTML = snapshot.hand.map((card, index) => {
          const definition = definitionFor(card);
          const selected = card.instanceId === selectedCardId;
          const unaffordable = definition.cost > snapshot.player.resource || snapshot.phase !== "main";
          return `<button class="physical-card hand-card ${selected ? "selected" : ""} ${unaffordable ? "unaffordable" : ""}" style="animation-delay:${index * 45}ms" type="button" data-card-id="${escapeHtml(card.instanceId)}" aria-label="View ${escapeHtml(definition.name)} details" aria-pressed="${selected}"><span class="card-name">${escapeHtml(definition.name)}</span></button>`;
        }).join("");
      }

      function findCardReference(instanceId) {
        const handCard = snapshot.hand.find(card => card.instanceId === instanceId);
        if (handCard) return { card: handCard, location: "hand" };
        for (const lane of snapshot.lanes) {
          if (lane.player?.instanceId === instanceId) return { card: lane.player, location: "board" };
          if (lane.enemy?.instanceId === instanceId) return { card: lane.enemy, location: "board" };
        }
        return null;
      }

      function openDetails(reference) {
        if (!reference) return;
        detailReference = reference;
        const definition = definitionFor(reference.card);
        el.detailTitle.textContent = definition.name;
        el.detailId.textContent = `${reference.card.definitionId} · ${reference.card.instanceId}`;
        el.detailBody.innerHTML = detailMarkup(definition);
        const canPlay = reference.location === "hand" && snapshot.phase === "main" && definition.cost <= snapshot.player.resource;
        el.detailPlay.hidden = reference.location !== "hand";
        el.detailPlay.disabled = !canPlay;
        el.detailPlay.textContent = canPlay ? "Select to play" : definition.cost > snapshot.player.resource ? "Not enough resource" : "Not playable in this phase";
        el.detailBackdrop.classList.add("open");
        el.detailBackdrop.setAttribute("aria-hidden", "false");
        el.detailClose.focus();
      }

      function detailMarkup(definition) {
        const tags = definition.tags.length ? definition.tags.join(", ") : "—";
        const keywords = definition.keywords.length ? definition.keywords.join(", ") : "—";
        const abilities = definition.abilities.length
          ? definition.abilities.map(ability => `<article class="ability"><strong>${escapeHtml(ability.name)}</strong><dl><dt>Trigger</dt><dd>${escapeHtml(ability.trigger)}</dd><dt>Target</dt><dd>${escapeHtml(ability.target)}</dd><dt>Condition</dt><dd>${escapeHtml(ability.condition)}</dd><dt>Effects</dt><dd>${escapeHtml(ability.effects)}</dd></dl></article>`).join("")
          : "<span>No abilities.</span>";
        return `<div class="detail-stats"><div class="detail-stat"><span>Cost</span><strong>${definition.cost}</strong></div><div class="detail-stat"><span>Attack</span><strong>${definition.attack}</strong></div><div class="detail-stat"><span>Health</span><strong>${definition.health}</strong></div></div>
          <section class="detail-section"><h3>Identity</h3><div class="detail-grid"><div><span>Type</span><br>${escapeHtml(definition.type)}</div><div><span>Class</span><br>${escapeHtml(definition.className)}</div><div><span>Alignment</span><br>${escapeHtml(definition.alignment)}</div><div><span>Tags</span><br>${escapeHtml(tags)}</div><div><span>Keywords</span><br>${escapeHtml(keywords)}</div></div></section>
          <section class="detail-section"><h3>Card text</h3><div>${escapeHtml(definition.text)}</div></section>
          <section class="detail-section"><h3>Abilities</h3>${abilities}</section>`;
      }

      function closeDetails() {
        detailReference = null;
        el.detailBackdrop.classList.remove("open");
        el.detailBackdrop.setAttribute("aria-hidden", "true");
      }

      function selectDetailCardToPlay() {
        if (!detailReference || detailReference.location !== "hand") return;
        const definition = definitionFor(detailReference.card);
        if (snapshot.phase !== "main" || definition.cost > snapshot.player.resource) return;
        selectedCardId = detailReference.card.instanceId;
        closeDetails();
        renderAll();
        showToast(`${definition.name} selected. Choose an empty lane.`);
      }

      function onHandClick(event) {
        const cardButton = event.target.closest("[data-card-id]");
        if (!cardButton) return;
        openDetails(findCardReference(cardButton.dataset.cardId));
      }

      function onBattlefieldClick(event) {
        const boardCard = event.target.closest("[data-board-card-id]");
        if (boardCard) {
          openDetails(findCardReference(boardCard.dataset.boardCardId));
          return;
        }

        const laneElement = event.target.closest("[data-lane-id]");
        if (!laneElement || !selectedCardId) return;
        const lane = snapshot.lanes.find(item => item.id === laneElement.dataset.laneId);
        if (!lane || lane.player) return;
        const command = { type: "PlayCardCommand", playerId: "player.alpha", cardInstanceId: selectedCardId, laneId: lane.id };
        consumeResult(simulation.submit(command), "Play card");
      }

      function onAdvancePhase() {
        selectedCardId = null;
        closeDetails();
        consumeResult(simulation.submit({ type: "EndPhaseCommand", playerId: "player.alpha" }), "Advance phase");
      }

      function consumeResult(result, contextLabel) {
        if (result.command) log("command", `#${result.command.sequence} ${result.command.type}`, JSON.stringify(result.command));
        result.events.forEach(event => {
          const payload = { ...event };
          delete payload.type;
          log(result.accepted ? "event" : "system", event.type, Object.keys(payload).length ? JSON.stringify(payload) : contextLabel);
        });
        snapshot = result.snapshot;
        if (result.accepted) selectedCardId = null;
        renderAll();
        showToast(result.accepted ? `${contextLabel} accepted by demo adapter.` : `${contextLabel} rejected.`);
      }

      function restart() {
        selectedCardId = null;
        closeDetails();
        el.eventLog.innerHTML = "";
        const result = simulation.restart();
        snapshot = result.snapshot;
        renderAll();
        log("system", "Fixture reset", `Loaded deterministic seed ${snapshot.seed}.`);
        showToast("Simulator fixture reset.");
      }

      function log(kind, title, message) {
        const entry = document.createElement("article");
        entry.className = "event";
        entry.innerHTML = `<strong>${escapeHtml(kind.toUpperCase())} · ${escapeHtml(title)}</strong><span>${escapeHtml(message)}</span>`;
        el.eventLog.prepend(entry);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        el.toast.textContent = message;
        el.toast.classList.add("show");
        toastTimer = window.setTimeout(() => el.toast.classList.remove("show"), 2200);
      }

      el.hand.addEventListener("click", onHandClick);
      el.battlefield.addEventListener("click", onBattlefieldClick);
      el.phaseButton.addEventListener("click", onAdvancePhase);
      el.restartButton.addEventListener("click", restart);
      el.detailClose.addEventListener("click", closeDetails);
      el.detailCloseSecondary.addEventListener("click", closeDetails);
      el.detailPlay.addEventListener("click", selectDetailCardToPlay);
      el.detailBackdrop.addEventListener("click", event => { if (event.target === el.detailBackdrop) closeDetails(); });
      document.addEventListener("keydown", event => { if (event.key === "Escape") closeDetails(); });

      renderAll();
      log("system", "Presentation fixture ready", "Card faces show name only. Click a card for schema-style metadata; use Select to play to create a command intent.");
    })();
  </script>
</body>
</html>
