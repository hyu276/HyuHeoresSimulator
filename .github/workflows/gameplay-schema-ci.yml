name: Gameplay Schema CI

on:
  push:
    paths:
      - "src/HyuHeroes.Gameplay/**"
      - "src/HyuHeroes.ContentStore.Postgres/**"
      - "src/HyuHeroes.AdminApi/**"
      - "tests/HyuHeroes.Gameplay.Tests/**"
      - "tests/HyuHeroes.AdminApi.Tests/**"
      - ".github/workflows/gameplay-schema-ci.yml"
  pull_request:
    paths:
      - "src/HyuHeroes.Gameplay/**"
      - "src/HyuHeroes.ContentStore.Postgres/**"
      - "src/HyuHeroes.AdminApi/**"
      - "tests/HyuHeroes.Gameplay.Tests/**"
      - "tests/HyuHeroes.AdminApi.Tests/**"
      - ".github/workflows/gameplay-schema-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hyu
          POSTGRES_PASSWORD: hyu
          POSTGRES_DB: hyu_content_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hyu -d hyu_content_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HYU_TEST_POSTGRES: "Host=localhost;Port=5432;Database=hyu_content_test;Username=hyu;Password=hyu;Pooling=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore gameplay tests
        run: dotnet restore tests/HyuHeroes.Gameplay.Tests/HyuHeroes.Gameplay.Tests.csproj
      - name: Restore Admin API tests
        run: dotnet restore tests/HyuHeroes.AdminApi.Tests/HyuHeroes.AdminApi.Tests.csproj
      - name: Test gameplay
        run: dotnet test tests/HyuHeroes.Gameplay.Tests/HyuHeroes.Gameplay.Tests.csproj --configuration Release --no-restore
      - name: Test Admin API
        run: dotnet test tests/HyuHeroes.AdminApi.Tests/HyuHeroes.AdminApi.Tests.csproj --configuration Release --no-restore
